<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --kh-cream: #F7F5F0;
    --kh-white: #FFFFFF;
    --kh-ink: #1A1814;
    --kh-ink-2: #7A756C;
    --kh-ink-3: #A8A299;
    --kh-border: #E4E0D8;
    --kh-border-strong: #D6D1C7;
    --kh-indigo: #635BFF;
    --kh-indigo-hover: #514AE0;
    --kh-indigo-soft: #ECEBFF;
    --kh-dark: #1A1814;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--font-sans); background: var(--kh-cream); color: var(--kh-ink); }
  #map { height: 100vh; width: 100%; }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,0.97); border-radius: 12px;
    padding: 20px 22px; width: 310px;
    border: 0.5px solid var(--kh-border);
    box-shadow: 0 4px 16px rgba(26,24,20,0.06);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--kh-border); border-radius: 2px; }

  .panel-eyebrow {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--kh-ink-2); margin-bottom: 6px;
  }
  .panel-title {
    font-family: var(--font-mono); font-size: 18px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--kh-ink); margin-bottom: 4px;
  }
  .panel-sub {
    font-size: 13px; color: var(--kh-ink-2); margin-bottom: 16px; line-height: 1.5;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card {
    background: var(--kh-cream); border-radius: 8px; padding: 10px 12px;
    border: 0.5px solid var(--kh-border);
  }
  .stat-card.highlight {
    background: var(--kh-indigo-soft); border-color: var(--kh-indigo);
  }
  .stat-value {
    font-family: var(--font-mono); font-size: 20px; font-weight: 600;
    color: var(--kh-ink); letter-spacing: -0.02em;
  }
  .stat-card.highlight .stat-value { color: var(--kh-indigo); }
  .stat-label { font-size: 11px; color: var(--kh-ink-2); margin-top: 2px; }

  .group-toggle {
    display: flex; gap: 6px; margin-bottom: 14px;
    background: var(--kh-cream); border-radius: 8px; padding: 3px;
    border: 0.5px solid var(--kh-border);
  }
  .group-btn {
    flex: 1; padding: 7px 8px; border: none; border-radius: 6px;
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; background: transparent;
    color: var(--kh-ink-2);
  }
  .group-btn.active { background: #fff; color: var(--kh-ink); box-shadow: 0 1px 3px rgba(26,24,20,0.08); }
  .group-btn:hover:not(.active) { color: var(--kh-ink); }

  .divider { border-top: 0.5px solid var(--kh-border); margin: 12px 0; }

  .section-header {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--kh-ink-2); margin: 10px 0 6px;
  }

  .wave-row {
    display: flex; align-items: center; padding: 5px 6px; font-size: 12px;
    cursor: pointer; border-radius: 6px; margin: 0 -6px;
    transition: background 0.15s;
  }
  .wave-row:hover { background: var(--kh-cream); }
  .wave-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .wave-name { flex: 1; color: var(--kh-ink); font-weight: 500; }
  .wave-meta { color: var(--kh-ink-3); font-size: 11px; font-family: var(--font-mono); }
  .wave-window { font-size: 10px; color: var(--kh-ink-3); margin-left: 18px; margin-top: 1px; margin-bottom: 4px; }

  .g2-summary {
    display: flex; align-items: center; padding: 5px 6px; font-size: 12px;
    border-radius: 6px; margin: 0 -6px;
  }
  .g2-summary .wave-dot { background: var(--kh-border-strong); }

  .site-list {
    margin-left: 18px; margin-bottom: 6px;
  }
  .site-list-item {
    font-size: 11px; color: var(--kh-ink-2); line-height: 1.6;
    display: flex; justify-content: space-between;
  }
  .site-list-item .ctrs {
    font-family: var(--font-mono); font-size: 10px; color: var(--kh-ink-3);
  }

  .disclaimer {
    font-size: 10px; color: var(--kh-ink-3); margin-top: 14px; line-height: 1.5;
    padding: 8px 10px; border-radius: 6px;
    background: var(--kh-cream); border: 0.5px solid var(--kh-border);
  }

  .footer-note {
    font-size: 10px; color: var(--kh-ink-3); margin-top: 10px; line-height: 1.4;
    font-family: var(--font-mono);
  }

  /* Popup styling */
  .leaflet-popup-content-wrapper {
    border-radius: 10px !important; border: 0.5px solid var(--kh-border) !important;
    box-shadow: 0 4px 16px rgba(26,24,20,0.1) !important;
    font-family: var(--font-sans);
  }
  .leaflet-popup-content { margin: 14px 16px !important; }
  .popup-eyebrow {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px;
  }
  .popup-title {
    font-family: var(--font-mono); font-weight: 600; font-size: 15px;
    color: var(--kh-ink); margin-bottom: 6px; letter-spacing: -0.02em;
  }
  .popup-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; color: white; margin-bottom: 8px;
    font-family: var(--font-mono);
  }
  .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
  .popup-item { font-size: 12px; }
  .popup-label { color: var(--kh-ink-3); font-size: 11px; }
  .popup-val { color: var(--kh-ink); font-weight: 500; }
  .popup-addr {
    font-size: 11px; color: var(--kh-ink-3); margin-top: 6px;
    border-top: 0.5px solid var(--kh-border); padding-top: 6px;
  }

  .leaflet-control-zoom a { border-radius: 6px !important; }
</style>
</head>

  var eyebrowColor = isDec ? INDIGO : MUTED;
  var badgeColor = isDec ? color : '#A8A299';

  var popup = '<div class="popup-eyebrow" style="color:' + eyebrowColor + '">' + groupLabel + '</div>' +
    '<div class="popup-title">' + s.name + '</div>' +
    '<div class="popup-badge" style="background:' + badgeColor + '">' + groupLabel + '</div>' +
    '<div class="popup-grid">' +
    '<div class="popup-item"><span class="popup-label">Counters</span><br><span class="popup-val">' + s.counters + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Region</span><br><span class="popup-val">' + s.region + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Est. cups/yr</span><br><span class="popup-val">' + sucs + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Group</span><br><span class="popup-val">' + groupLabel + '</span></div>' +
    '</div>' +
    (s.address ? '<div class="popup-addr">' + s.address + '</div>' : '');

  marker.bindPopup(popup);

  if (isDec) {
    decLayer.addLayer(marker);
  } else {
    q1Layer.addLayer(marker);
  }
});

decLayer.addTo(map);
q1Layer.addTo(map);

// Fit bounds
var coords = sites.map(function(s) { return [s.lat, s.lon]; });
map.fitBounds(coords, { padding: [40, 320] });

// Build group list in the panel
function buildGroupList(filter) {
  var el = document.getElementById('groupList');
  el.innerHTML = '';

  if (filter === 'all' || filter === 'dec2026') {
    var hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.textContent = 'December 2026  —  13 sites, 58 counters';
    el.appendChild(hdr);

    [1, 2, 3].forEach(function(wn) {
      var wm = waveMeta[wn];
      var color = waveColors[wn];

      var row = document.createElement('div');
      row.className = 'wave-row';
      row.onclick = function() { zoomWave(wn); };
      row.innerHTML =
        '<span class="wave-dot" style="background:' + color + '"></span>' +
        '<span class="wave-name">' + wm.label + '</span>' +
        '<span class="wave-meta">' + wm.sites.length + ' / ' + wm.counters + '</span>';
      el.appendChild(row);

      var win = document.createElement('div');
      win.className = 'wave-window';
      win.textContent = wm.window;
      el.appendChild(win);

      var list = document.createElement('div');
      list.className = 'site-list';
      wm.sites.forEach(function(name) {
        var s = sites.find(function(x) { return x.name === name; });
        var item = document.createElement('div');
        item.className = 'site-list-item';
        item.innerHTML = '<span>' + name + '</span><span class="ctrs">' + (s ? s.counters : '') + '</span>';
        list.appendChild(item);
      });
      el.appendChild(list);
    });
  }

  if (filter === 'all') {
    var div = document.createElement('div');
    div.className = 'divider';
    el.appendChild(div);
  }

  if (filter === 'all' || filter === 'q12027') {
    var hdr2 = document.createElement('div');
    hdr2.className = 'section-header';
    hdr2.textContent = 'Q1 2027  —  48 sites, 142 counters';
    el.appendChild(hdr2);

    var summary = document.createElement('div');
    summary.className = 'g2-summary';
    summary.innerHTML =
      '<span class="wave-dot"></span>' +
      '<span class="wave-name" style="color:var(--kh-ink-2)">Remaining estate</span>' +
      '<span class="wave-meta">48 / 142</span>';
    el.appendChild(summary);
  }
}

buildGroupList('all');

function showGroup(group, btn) {
  document.querySelectorAll('.group-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

  if (group === 'all') {
    map.addLayer(decLayer);
    map.addLayer(q1Layer);
  } else if (group === 'dec2026') {
    map.addLayer(decLayer);
    map.removeLayer(q1Layer);
  } else {
    map.removeLayer(decLayer);
    map.addLayer(q1Layer);
  }

  buildGroupList(group);

  // Refit bounds
  var visCoords = [];
  sites.forEach(function(s) {
    if (group === 'all' || s.group === group) visCoords.push([s.lat, s.lon]);
  });
  if (visCoords.length) map.fitBounds(visCoords, { padding: [40, 320] });
}

function zoomWave(waveNum) {
  var wCoords = [];
  sites.forEach(function(s) {
    if (s.wave === waveNum) wCoords.push([s.lat, s.lon]);
  });
  if (wCoords.length) {
    map.fitBounds(wCoords, { padding: [60, 340], maxZoom: 10 });
  }
}
</script>
</body>
</html>
