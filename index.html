<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --kh-cream: #F7F5F0;
    --kh-ink: #1A1814;
    --kh-ink-2: #7A756C;
    --kh-ink-3: #A8A299;
    --kh-border: #E4E0D8;
    --kh-indigo: #635BFF;
    --kh-orange: #E8943A;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--font-sans); background: var(--kh-cream); color: var(--kh-ink); }
  #map { height: 100vh; width: 100%; }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,0.97); border-radius: 12px;
    padding: 20px 22px; width: 300px;
    border: 0.5px solid var(--kh-border);
    box-shadow: 0 4px 16px rgba(26,24,20,0.06);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--kh-border); border-radius: 2px; }

  .panel-eyebrow {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--kh-ink-2); margin-bottom: 6px;
  }
  .panel-title {
    font-family: var(--font-mono); font-size: 18px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--kh-ink); margin-bottom: 4px;
  }
  .panel-sub {
    font-size: 13px; color: var(--kh-ink-2); margin-bottom: 16px; line-height: 1.5;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card {
    background: var(--kh-cream); border-radius: 8px; padding: 10px 12px;
    border: 0.5px solid var(--kh-border);
  }
  .stat-value {
    font-family: var(--font-mono); font-size: 20px; font-weight: 600;
    color: var(--kh-ink); letter-spacing: -0.02em;
  }
  .stat-label { font-size: 11px; color: var(--kh-ink-2); margin-top: 2px; }

  .phase-toggle {
    display: flex; gap: 6px; margin-bottom: 14px;
    background: var(--kh-cream); border-radius: 8px; padding: 3px;
    border: 0.5px solid var(--kh-border);
  }
  .phase-btn {
    flex: 1; padding: 7px 10px; border: none; border-radius: 6px;
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; background: transparent;
    color: var(--kh-ink-2);
  }
  .phase-btn.active { background: #fff; color: var(--kh-ink); box-shadow: 0 1px 3px rgba(26,24,20,0.08); }
  .phase-btn:hover:not(.active) { color: var(--kh-ink); }

  .divider { border-top: 0.5px solid var(--kh-border); margin: 12px 0; }

  .wave-section { margin-bottom: 4px; }
  .phase-header {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--kh-ink-2); margin: 10px 0 6px;
  }
  .wave-row {
    display: flex; align-items: center; padding: 4px 0; font-size: 12px;
    cursor: pointer; border-radius: 4px; padding: 4px 6px; margin: 0 -6px;
    transition: background 0.15s;
  }
  .wave-row:hover { background: var(--kh-cream); }
  .wave-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .wave-name { flex: 1; color: var(--kh-ink); font-weight: 500; }
  .wave-meta { color: var(--kh-ink-3); font-size: 11px; font-family: var(--font-mono); }
  .wave-window { font-size: 10px; color: var(--kh-ink-3); margin-left: 18px; margin-top: 1px; }

  .footer-note {
    font-size: 10px; color: var(--kh-ink-3); margin-top: 12px; line-height: 1.4;
    font-family: var(--font-mono);
  }

  /* Popup styling */
  .leaflet-popup-content-wrapper {
    border-radius: 10px !important; border: 0.5px solid var(--kh-border) !important;
    box-shadow: 0 4px 16px rgba(26,24,20,0.1) !important;
    font-family: var(--font-sans);
  }
  .leaflet-popup-content { margin: 14px 16px !important; }
  .popup-eyebrow {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px;
  }
  .popup-title { font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--kh-ink); margin-bottom: 6px; letter-spacing: -0.02em; }
  .popup-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; color: white; margin-bottom: 8px;
    font-family: var(--font-mono);
  }
  .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
  .popup-item { font-size: 12px; }
  .popup-label { color: var(--kh-ink-3); font-size: 11px; }
  .popup-val { color: var(--kh-ink); font-weight: 500; }
  .popup-addr { font-size: 11px; color: var(--kh-ink-3); margin-top: 6px; border-top: 0.5px solid var(--kh-border); padding-top: 6px; }

  .leaflet-control-layers { border-radius: 10px !important; }
  .leaflet-control-zoom a { border-radius: 6px !important; }
</style>

var waveColors = {"1": "#E63946", "2": "#D4522A", "3": "#F4A261", "4": "#E9C46A", "5": "#2A9D8F", "6": "#457B9D", "7": "#6366F1", "8": "#8B5CF6", "9": "#10B981", "10": "#EC4899", "11": "#06B6D4", "12": "#9333EA"};
var waveMeta = {"1": {"cluster": "East Midlands + Attingham", "window": "Nov 2026, weeks 1-2", "phase": 1, "sites": 6, "counters": 31}, "2": {"cluster": "North West + North Wales", "window": "Nov 2026, weeks 2-3", "phase": 1, "sites": 7, "counters": 24}, "3": {"cluster": "London & South East", "window": "Nov 2026, week 4", "phase": 1, "sites": 6, "counters": 22}, "4": {"cluster": "East of England", "window": "Dec 2026, week 1", "phase": 1, "sites": 4, "counters": 16}, "5": {"cluster": "South West", "window": "Dec 2026, week 2", "phase": 1, "sites": 3, "counters": 9}, "6": {"cluster": "North East + Yorkshire + Cumbria", "window": "Feb 2027, weeks 1-2", "phase": 2, "sites": 7, "counters": 24}, "7": {"cluster": "Kent, Surrey & Sussex", "window": "Feb 2027, weeks 2-3", "phase": 2, "sites": 6, "counters": 15}, "8": {"cluster": "London orbit + Hertfordshire/Beds", "window": "Feb-Mar 2027", "phase": 2, "sites": 6, "counters": 12}, "9": {"cluster": "Midlands remainder", "window": "Mar 2027, weeks 1-2", "phase": 2, "sites": 6, "counters": 19}, "10": {"cluster": "Wales", "window": "Mar 2027, weeks 2-3", "phase": 2, "sites": 5, "counters": 15}, "11": {"cluster": "South West remainder", "window": "Mar 2027, week 3", "phase": 2, "sites": 3, "counters": 9}, "12": {"cluster": "Northern Ireland", "window": "Mar 2027, week 4", "phase": 2, "sites": 2, "counters": 4}};

// Create markers per wave
var waveLayers = {};
var allMarkers = [];

sites.forEach(function(s) {
  var color = waveColors[String(s.wave)] || '#888';
  var radius = Math.max(7, Math.min(15, s.counters * 2));

  var marker = L.circleMarker([s.lat, s.lon], {
    radius: radius,
    fillColor: color,
    color: '#fff',
    weight: 1.5,
    opacity: 0.95,
    fillOpacity: 0.85
  });

  var sucs = s.est_sucs > 1000 ? (s.est_sucs / 1000).toFixed(0) + 'K' : s.est_sucs;
  var phaseLabel = 'Phase ' + s.phase + ' / Wave ' + s.wave;

  var popup = '<div class="popup-eyebrow" style="color:' + color + '">' + phaseLabel + '</div>' +
    '<div class="popup-title">' + s.name + '</div>' +
    '<div class="popup-badge" style="background:' + color + '">' + s.cluster + '</div>' +
    '<div class="popup-grid">' +
    '<div class="popup-item"><span class="popup-label">Counters</span><br><span class="popup-val">' + s.counters + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Outlets</span><br><span class="popup-val">' + s.outlets + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Est. SUCs/yr</span><br><span class="popup-val">' + sucs + '</span></div>' +
    '<div class="popup-item"><span class="popup-label">Install window</span><br><span class="popup-val">' + s.window + '</span></div>' +
    '</div>' +
    (s.address ? '<div class="popup-addr">' + s.address + '</div>' : '') +
    (s.notes ? '<div class="popup-addr" style="font-style:italic">' + s.notes + '</div>' : '');

  marker.bindPopup(popup);

  var wKey = String(s.wave);
  if (!waveLayers[wKey]) waveLayers[wKey] = L.layerGroup();
  waveLayers[wKey].addLayer(marker);
  allMarkers.push({marker: marker, site: s});
});

// Add all to map
Object.values(waveLayers).forEach(function(lg) { lg.addTo(map); });

// Fit bounds
var coords = sites.map(function(s) { return [s.lat, s.lon]; });
map.fitBounds(coords, {padding: [40, 300]});

// Build wave list
function buildWaveList(phaseFilter) {
  var container = document.getElementById('waveList');
  container.innerHTML = '';
  var currentPhase = 0;

  var waveNums = Object.keys(waveMeta).sort(function(a,b) { return parseInt(a) - parseInt(b); });
  waveNums.forEach(function(wn) {
    var wm = waveMeta[wn];
    if (phaseFilter !== 'all' && wm.phase !== phaseFilter) return;

    if (wm.phase !== currentPhase) {
      currentPhase = wm.phase;
      var hdr = document.createElement('div');
      hdr.className = 'phase-header';
      hdr.textContent = 'Phase ' + currentPhase + (currentPhase === 1 ? ' (Nov-Dec 2026)' : ' (Feb-Mar 2027)');
      container.appendChild(hdr);
    }

    var row = document.createElement('div');
    var color = waveColors[wn] || '#888';
    row.innerHTML = '<div class="wave-row" onclick="zoomWave(' + wn + ')">' +
      '<span class="wave-dot" style="background:' + color + '"></span>' +
      '<span class="wave-name">W' + wn + ': ' + wm.cluster + '</span>' +
      '<span class="wave-meta">' + wm.sites + '/' + wm.counters + '</span>' +
      '</div>' +
      '<div class="wave-window">' + wm.window + '</div>';
    container.appendChild(row);
  });
}

buildWaveList('all');

function showView(phase, btn) {
  document.querySelectorAll('.phase-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

  Object.keys(waveLayers).forEach(function(wn) {
    var wm = waveMeta[wn];
    if (phase === 'all' || wm.phase === phase) {
      map.addLayer(waveLayers[wn]);
    } else {
      map.removeLayer(waveLayers[wn]);
    }
  });

  buildWaveList(phase);

  // Refit bounds to visible
  var visCoords = [];
  sites.forEach(function(s) {
    if (phase === 'all' || s.phase === phase) visCoords.push([s.lat, s.lon]);
  });
  if (visCoords.length) map.fitBounds(visCoords, {padding: [40, 300]});
}

function zoomWave(waveNum) {
  var wCoords = [];
  sites.forEach(function(s) {
    if (s.wave === waveNum) wCoords.push([s.lat, s.lon]);
  });
  if (wCoords.length) {
    map.fitBounds(wCoords, {padding: [60, 320], maxZoom: 10});
  }
}
